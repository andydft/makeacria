<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Male Base Character - Preview</title>
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --text: #1f2937;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #f8fafc 0%, var(--bg) 70%);
      font-family: Arial, sans-serif;
      color: var(--text);
    }
    .panel {
      background: var(--panel);
      padding: 24px 28px 20px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 18px; margin: 0 0 6px; font-weight: 700; }
    p { font-size: 13px; margin: 0 0 14px; color: #4b5563; }
    .frame {
      background: linear-gradient(180deg, #fbfdff 0%, #edf2f7 100%);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid #e5e7eb;
    }
    svg { display: block; width: 420px; height: auto; max-width: 80vw; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Personagem-base masculino (SVG estático)</h1>
    <p>Frente, fundo neutro, sem animação. IDs/grupos separados para animação futura.</p>

</html>
