  </g>

  
  <g transform="translate(182, 11)">
    <use href="#dragon-ball-base" />
    <use href="#star-1x" x="10" y="6" />
    <use href="#star-1x" x="6" y="8" />
    <use href="#star-1x" x="14" y="8" />
    <use href="#star-1x" x="10" y="10" />
    <use href="#star-1x" x="6" y="12" />
    <use href="#star-1x" x="14" y="12" />
