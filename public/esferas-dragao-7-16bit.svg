<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 36" width="700" height="120" role="img" aria-label="As 7 Esferas do Dragão com estrelas de 1 a 7 em estilo 16-bit com fundo transparente">
  <defs>
    <style>
      .o { fill: #121014; }
      .orb-hi { fill: #FFF29C; }
      .orb-main { fill: #FF9E1B; }
      .orb-warm { fill: #F26419; }
      .orb-shd { fill: #C93B0E; }
      .orb-deep { fill: #8C1D05; }
      .glare { fill: #FFFFFF; }
      .star-hi { fill: #FF595E; }
      .star { fill: #D91E2A; }
      .star-d { fill: #8F0D16; }
    </style>

    
    <g id="dragon-ball-base">
      <rect class="o" x="7" y="1" width="10" height="2" />
      <rect class="o" x="4" y="3" width="3" height="2" />
      <rect class="o" x="17" y="3" width="3" height="2" />
      <rect class="o" x="2" y="5" width="2" height="3" />
      <rect class="o" x="20" y="5" width="2" height="3" />
      <rect class="o" x="1" y="8" width="2" height="8" />
      <rect class="o" x="21" y="8" width="2" height="8" />
      <rect class="o" x="2" y="16" width="2" height="3" />
      <rect class="o" x="20" y="16" width="2" height="3" />
      <rect class="o" x="4" y="19" width="3" height="2" />
      <rect class="o" x="17" y="19" width="3" height="2" />
      <rect class="o" x="7" y="21" width="10" height="2" />

      <rect class="orb-hi" x="7" y="3" width="10" height="2" />
      <rect class="orb-hi" x="4" y="5" width="16" height="2" />
      <rect class="orb-hi" x="3" y="7" width="10" height="2" />

      <rect class="orb-main" x="13" y="7" width="8" height="3" />
      <rect class="orb-main" x="3" y="9" width="18" height="4" />
      <rect class="orb-main" x="3" y="13" width="14" height="3" />

      <rect class="orb-warm" x="17" y="13" width="4" height="3" />
      <rect class="orb-shd" x="4" y="16" width="16" height="3" />
      <rect class="orb-deep" x="7" y="19" width="10" height="2" />

      
      <rect class="glare" x="6" y="5" width="3" height="1" />
      <rect class="glare" x="5" y="6" width="2" height="2" />
      <rect class="glare" x="8" y="6" width="1" height="1" />
    </g>

    
    <g id="star-1x">
      <rect class="star-d" x="1" y="0" width="1" height="1" />
      <rect class="star-hi" x="0" y="1" width="1" height="1" />
      <rect class="star" x="1" y="1" width="1" height="1" />
      <rect class="star-d" x="2" y="1" width="1" height="1" />
      <rect class="star-d" x="1" y="2" width="1" height="1" />
    </g>
  </defs>

  
  <g transform="translate(4, 11)">
