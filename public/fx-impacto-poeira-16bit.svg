<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="600" height="400" role="img" aria-label="Efeitos de impacto e poeira estilo 16-bits em SVG puro">
  <defs>
    <style>
      .o { fill: #121014; } /* Contorno */
      .sp { fill: #FFE066; } /* Faísca / impacto amarelo */
      .spl { fill: #FFF9DB; } /* Brilho impacto */
      .spo { fill: #FF922B; } /* Borda laranja impacto */
      .dt { fill: #E6CCB2; } /* Poeira clara */
      .dtd { fill: #B08968; } /* Poeira sombra */
      .dtl { fill: #FAF0E6; } /* Brilho poeira */
      .sh { fill: #F8F9FA; } /* Linhas de tremor / choque */
    </style>
  </defs>

  
  <g id="fx-impact">
    
    <path class="o" d="M24 10h4v6h4v-4h4v6h6v4h-6v4h6v4h-6v6h-4v-4h-4v6h-4v-6h-4v4h-4v-6h-6v-4h6v-4h-6v-4h6v-6h4v4h4z" />
    
