    <path class="sp" d="M26 14v5h6v-3v3h6v4h-6v5v-3h-6v5v-5h-5v3v-3h-5v-4h5v-3v3h5z" />
    <rect class="spl" x="25" y="21" width="2" height="3" />
  </g>

  
  <g id="fx-dust">
    
    <path class="o" d="M44 46h4v-2h8v2h2v6h-2v2H44v-2h-2v-6h2z" />
