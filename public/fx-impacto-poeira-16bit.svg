    <rect class="dtl" x="47" y="46" width="5" height="2" />
    <rect class="dtd" x="45" y="51" width="10" height="1" />

    
    <path class="o" d="M58 40h4v-2h10v2h2v2h2v8h-2v2H58v-2h-2v-8h2z" />
