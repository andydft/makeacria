    <rect class="dtl" x="61" y="40" width="6" height="2" />
    <rect class="dtd" x="59" y="48" width="12" height="2" />

    
    <path class="o" d="M74 47h4v-2h8v2h2v5h-2v2H74v-2h-2v-5h2z" />
