<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="512" height="614" role="img" aria-label="Goku bebê simples com cabelo espetado escuro, cauda marrom e expressão inocente em 16-bits em SVG puro">
