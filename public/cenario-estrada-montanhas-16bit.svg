<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" width="800" height="480" role="img" aria-label="Cenário de estrada e montanhas estilo 16-bits em SVG puro">
  <defs>
    <style>
      .sky-top { fill: #5AA9E6; }
      .sky-mid { fill: #7FC8F8; }
      .sky-low { fill: #B8E1FF; }
      .cloud { fill: #FFFFFF; }
      .cloud-s { fill: #DCEEFB; }
      .mtn-far { fill: #6B7FD7; }
      .mtn-far-l { fill: #889AE6; }
      .tree-d { fill: #2D6A4F; }
      .tree-m { fill: #40916C; }
      .tree-l { fill: #74C69D; }
      .trunk { fill: #6C4428; }
      .edge-g { fill: #52B788; }
