    <path class="mtn-far-l" d="M28 48h4v-4h8v4h-4v4h-8zM104 48h4v-4h10v4h-6v4h-8z" />

    
    <g id="tree-1">
      <rect class="trunk" x="18" y="56" width="4" height="10" />
