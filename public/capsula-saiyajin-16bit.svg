    <path class="hull" d="M33 15h14v2h6v2h4v3h4v4h2v5h2v6h1v12h-1v6h-2v5h-2v4h-4v3h-4v2h-6v2h-14v-2h-6v-2h-4v-3h-4v-4h-2v-5h-2v-6h-1v-12h1v-6h2v-5h2v-4h4v-3h4v-2h6z" />

    
    <path class="hull-l" d="M33 16h12v1h-11v1h-6v1h-4v2h-3v2h-3v3h-2v4h-1v10h-1v-10h1v-5h2v-4h3v-3h3v-2h4v-2h6z" />
    <path class="hull-hh" d="M31 18h8v1h-7v1h-4v1h-3v2h-2v3h-1v4h-1v-5h1v-3h2v-2h3v-1h4v-1zM20 27h2v2h-2z" />

    
    <path class="hull-d" d="M68 38h1v12h-1v6h-2v5h-2v4h-4v3h-4v2h-6v2h-14v-1h13v-1h6v-2h4v-2h4v-4h2v-4h2v-6h1z" />
