<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="512" height="614" role="img" aria-label="Cápsula espacial Saiyajin metálica esférica com janela circular e detalhes retrô em 16-bits em SVG puro">
  <defs>
    <style>
      .o { fill: #121014; } /* Contorno */

      /* Casco metálico branco-acinzentado / azulado Saiyajin */
      .hull { fill: #D7DCE6; }
      .hull-l { fill: #F4F7FC; }
      .hull-hh { fill: #FFFFFF; }
      .hull-d { fill: #9AA4B8; }
      .hull-dd { fill: #69738A; }

      /* Faixas de costura / painéis / rebites */
      .seam-d { fill: #515B70; }
      .accent-r { fill: #C9282E; }
      .accent-y { fill: #E3A82B; }

      /* Janela circular espelhada / vidro escuro com reflexo */
      .glass-bg { fill: #172336; }
      .glass-mid { fill: #263B59; }
      .glass-ref { fill: #699ED1; }
      .glass-hi { fill: #C9E8FF; }

      /* Base / propulsor inferior */
      .thruster { fill: #3E4659; }
      .thruster-d { fill: #232836; }
      .thruster-l { fill: #68738C; }
    </style>
  </defs>

  
  <g id="thruster-base">
    <path class="o" d="M26 77h28v2h2v3h-2v2h-28v-2h-2v-3h2z" />
    <path class="thruster" d="M27 78h26v2h2v1h-2v1h-28v-1h-2v-1h2z" />
    <path class="thruster-l" d="M28 78h8v2h-8zM26 80h10v1h-10z" />
    <path class="thruster-d" d="M44 78h9v2h2v1h-2v1h-9z" />
    <rect class="o" x="28" y="82" width="24" height="1" />
  </g>

  
  <g id="capsule-hull">
    
