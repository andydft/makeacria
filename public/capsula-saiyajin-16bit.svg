    <rect class="seam-d" x="54" y="66" width="1" height="1" />
  </g>

  
  <g id="capsule-window">
    
    <path class="o" d="M33 27h14v1h4v2h2v4h1v14h-1v4h-2v2h-4v1h-14v-1h-4v-2h-2v-4h-1v-14h1v-4h2v-2h4z" />
