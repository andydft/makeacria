    <rect class="hull-l" x="52" y="47" width="16" height="1" />

    
    <rect class="accent-r" x="21" y="43" width="2" height="2" />
    <rect class="accent-y" x="57" y="43" width="2" height="2" />
    <rect class="seam-d" x="25" y="25" width="1" height="1" />
    <rect class="seam-d" x="54" y="25" width="1" height="1" />
