    <rect class="o" x="6" y="186" width="12" height="1" />
    <rect class="ring-band" x="7" y="180" width="10" height="6" />
    <rect class="gold-hi" x="8" y="181" width="2" height="4" />
    <rect class="gold" x="10" y="181" width="4" height="4" />
    <rect class="gold-shd" x="14" y="181" width="2" height="4" />

    
    <rect class="o" x="10" y="181" width="4" height="4" />
