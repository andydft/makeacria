<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="512" height="614" role="img" aria-label="Gohan criança inspirado na referência com chapéu vermelho e amarelo, esfera de 4 estrelas, túnica amarela com mangas verdes e cauda em 16-bits em SVG puro">
